# =============================================================================
# Redis Configuration for IPMS
# =============================================================================
# This configuration provides optimal settings for the IPMS Redis instance
# which handles refresh token storage and session caching.
# =============================================================================

# Network configuration
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (optional for cache data, but helpful for recovery)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Logging
loglevel notice

# Connection handling
timeout 0
tcp-keepalive 300

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Security (no password for local development)
# requirepass null

# Performance tuning
hz 10
dynamic-hz yes

# Enable keyspace notifications for cache invalidation (optional)
# notify-keyspace-events Ex
